name: Bug report
description: Something isn't working right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Meal Plan
        2. Click Auto-fill
        3. …
  - type: input
    id: version
    attributes:
      label: BulkBoard version
      placeholder: "0.1.0 (BulkBoard → About BulkBoard)"
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 26.1, MacBook Air M3"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Please don't paste personal health data or backups.
